# Publishes the repository's app page (`dist/`) with the verified zero-import
# `wasm32` `VerdantAqm.holo` v4 guest, input-addressed BLAKE3 kappa cache
# (`ci/kappa-cache.ts`), signed SLSA build provenance (`attest-build-provenance`),
# content-addressed offline service-worker manifest (`precache.json`), and
# FR-03 wire-weight / acceptance-vector verification gates.
#
# Modeled directly after `afflom/verdant-engine/.github/workflows/pages.yml`
# with commit-pinned GitHub Actions and two-stage `build` -> `deploy` isolation.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build and verify VerdantAqm.holo, sign its provenance, assemble the page
    if: github.repository != 'UOR-Foundation/template'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pages: write
      id-token: write
      attestations: write
      # Input-addressed holo cache (ci/kappa-cache.ts) stores verified .holo
      # artifacts in this repository owner's ghcr.io/prism-holo package.
      packages: write

    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Verify TypeScript types, 8-facet Prism conformance, and 26 Wasm vectors
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm test

      - name: Look up this build by its input kappa
        # A VerdantAqm.holo v4 guest is a pure deterministic function of app/,
        # model/, crates/, and src/aqm/. When this owner already built those
        # exact bytes, the verified holo is restored and re-verified locally.
        id: cache
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx tsx ci/kappa-cache.ts restore .prism/build/kappa/VerdantAqm.holo app model crates src/aqm

      - name: Build and verify VerdantAqm.holo v4 guest on cache miss
        if: steps.cache.outputs.hit != 'true'
        shell: bash
        run: npx tsx ci/kappa-cache.ts build .prism/build/kappa/VerdantAqm.holo app model crates src/aqm

      - name: Find and fingerprint the holo
        id: holo
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          holos=(.prism/build/*/*.holo)
          if [[ ${#holos[@]} -ne 1 ]]; then
            printf 'expected one holo, found %d\n' "${#holos[@]}" >&2
            exit 64
          fi
          # The archive fingerprint is the holo's last 32 bytes (BLAKE3 over body).
          fingerprint=$(node -e 'const b=require("fs").readFileSync(process.argv[1]);process.stdout.write(b.subarray(b.length-32).toString("hex"))' "${holos[0]}")
          identities="$(dirname "${holos[0]}")/application/holo-identities.json"
          if [[ -f $identities ]]; then
            recorded=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).archive_fingerprint)' "$identities")
            if [[ $recorded != "$fingerprint" ]]; then
              echo "fingerprint $fingerprint differs from recorded $recorded" >&2
              exit 1
            fi
          fi
          {
            echo "path=${holos[0]}"
            echo "fingerprint=$fingerprint"
          } >>"$GITHUB_OUTPUT"

      - name: Store this build under its input kappa
        if: steps.cache.outputs.hit != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOLO: ${{ steps.holo.outputs.path }}
          KAPPA: ${{ steps.cache.outputs.kappa }}
        run: npx tsx ci/kappa-cache.ts save "$HOLO"

      - name: Sign the holo's provenance as this repository's workflow
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.holo.outputs.path }}
          show-summary: false

      - name: Assemble the page and content-addressed precache manifest
        shell: bash
        env:
          VITE_BASE_PATH: "./"
          PAGES_BASE_URL: "${{ steps.pages.outputs.base_url }}/"
          HOLO: ${{ steps.holo.outputs.path }}
          FINGERPRINT: ${{ steps.holo.outputs.fingerprint }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -euo pipefail
          npm run build
          npx tsx bootstrap/assemble-pages.ts dist
          npx tsx bootstrap/precache.ts dist

      - name: Verify assembled site integrity, 26/26 Wasm replay, and FR-03 wire-weight gate
        shell: bash
        run: |
          set -euo pipefail
          npx tsx bootstrap/weight-gate.ts dist

      - name: Keep build verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pages-verification-report
          path: dist/holo-identities.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the page
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist

  deploy:
    name: publish the page
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
